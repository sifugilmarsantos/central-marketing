<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%233b82f6'><path d='M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5'/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Central de Marketing | Orquestrador de Campanhas</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body class="bg-slate-950 text-slate-100 min-h-screen antialiased selection:bg-indigo-500 selection:text-white">
    <div id="root">
      <div id="loading-placeholder" style="min-height: 100vh; display: flex; align-items: center; justify-content: center; background-color: #070b14; color: #94a3b8; font-family: sans-serif;">
        <div style="text-align: center; padding: 20px;">
          <div style="width: 40px; height: 40px; border: 3px solid rgba(59, 130, 246, 0.2); border-top-color: #3b82f6; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 16px auto;"></div>
          <div style="font-size: 15px; font-weight: 600; color: #f8fafc; letter-spacing: -0.01em;">Central de Marketing</div>
          <div style="font-size: 12px; color: #64748b; margin-top: 4px;">Carregando ambiente operacional...</div>
        </div>
      </div>
    </div>
    <style>
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
    <script>
      window.addEventListener('error', function(event) {
        var root = document.getElementById('root');
        if (root && (!root.children.length || document.getElementById('loading-placeholder'))) {
          root.innerHTML = '<div style="min-height: 100vh; background-color: #070b14; color: #f8fafc; display: flex; align-items: center; justify-content: center; padding: 24px; font-family: sans-serif;">' +
            '<div style="max-width: 520px; width: 100%; background: #0f172a; border: 1px solid rgba(239, 68, 68, 0.4); border-radius: 16px; padding: 24px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);">' +
              '<div style="color: #f87171; font-weight: 700; font-size: 18px; margin-bottom: 8px;">⚠️ Falha no Carregamento Inicial</div>' +
              '<p style="color: #cbd5e1; font-size: 13px; line-height: 1.5; margin-bottom: 16px;">Ocorreu um erro ao carregar o script da Central de Marketing:</p>' +
              '<div style="background: #020617; border: 1px solid #1e293b; border-radius: 8px; padding: 12px; font-family: monospace; font-size: 11px; color: #fca5a5; overflow-x: auto; margin-bottom: 20px;">' +
                (event.message || event.error || 'Erro desconhecido ao carregar módulo') +
              '</div>' +
              '<button onclick="window.location.reload(true)" style="background: #2563eb; color: #ffffff; border: none; border-radius: 8px; padding: 10px 18px; font-size: 13px; font-weight: 600; cursor: pointer;">🔄 Recarregar Aplicação</button>' +
            '</div>' +
          '</div>';
        }
      });
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
